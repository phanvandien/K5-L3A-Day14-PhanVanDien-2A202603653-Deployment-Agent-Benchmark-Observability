# Railway — build từ Dockerfile, Railway cấp biến PORT (CMD trong Dockerfile đọc ${PORT})
# Đặt AGENT_API_KEY và REDIS_URL trong tab Variables của service, KHÔNG ghi ở đây.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
